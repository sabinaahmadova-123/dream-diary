<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somnia - Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-area">
                <img src="images/logo.jpg" alt="logo">
                <span class="logo-text">Somnia</span>
            </div>
            <div class="navbar">
                <a href="index.html" class="archive-link">Back to Home</a>
            </div>
        </div>
    </header>

    <main>
        <section class="recent-dreams-section">
            <div class="section-header">
                <h2>All Archived Dreams</h2>
                <span class="dream-count" id="archive-counter">0 entries in your diary</span>
            </div>
            <div class="dreams-grid" id="archive-wrapper"></div>
        </section>
    </main>

    <script src="archive.js"></script>
</body>
</html>
