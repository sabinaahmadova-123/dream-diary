<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somnia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo-area">
                <img src="images/logo.jpg" alt="logo">
                <span class="logo-tex">Somnia</span>
            </div>

            <div class="navbar">
                <span>Archive</span>
            </div>
        </div>
    </header>
    <main>
        <div class="intro">
            <span class="intro-detail">✦ THE DREAM DIARY</span>
            <h1>Capture your dreams</h1>
            <h2>Where do you go when you sleep?</h2>
        </div>

        <div class="categories">
            <div>Lucid</div>
            <div>Nightmare</div>
            <div>Sweet</div>
            <div>Prophetic</div>
            <div>Surreal</div>
        </div>
        <div class="textarea-container">
            <textarea spellcheck="false" placeholder="What did you dream last night?"></textarea>
            <button class="analyze">✦ Analyze Dream</button>
        </div>

        <div class="cards-container" id="cosmic-cards-wrapper">
        </div>
    </main>

<script src="script.js"></script>
</body>

</html>
