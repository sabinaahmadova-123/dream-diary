<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somnia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo-area">
                <img src="images/image.png" alt="logo">
                <span class="logo-text">Somnia</span>
            </div>

            <div class="navbar">
                <a href="archive.html" class="archive-link">Archive</a>
            </div>
        </div>
    </header>
    <main>
        <div class="intro">
            <span class="intro-detail">✦ THE DREAM DIARY</span>
            <h1>
                <span>Capture your</span>
                <span class="dream-highlight">dreams.</span>
            </h1>
            <h2>Where do you go when you sleep?</h2>
        </div>

        <div class="categories">
            <div class="active">Lucid</div>
            <div>Nightmare</div>
            <div>Sweet</div>
            <div>Prophetic</div>
            <div>Surreal</div>
        </div>
        <div class="textarea-container">
            <textarea spellcheck="false" placeholder="What did you dream last night?"></textarea>
            <div class="buttons">
                <button class="analyze">✦ Analyze Dream</button>
                <button class="add-button">+</button>
            </div>
        </div>

        <div class="ai-result"></div>

        <!-- <div class="cards-container" id="cosmic-cards-wrapper">
        </div> -->

        <section class="recent-dreams-section">
            <div class="section-header">
                <h2 id="section-main-title">Recent Dreams</h2>
                <span class="dream-count" id="dream-counter">0 entries in your diary</span>
            </div>

            <div class="dreams-grid" id="dreams-wrapper"></div>
        </section>

        <div class="cards-container" id="cosmic-cards-wrapper"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
